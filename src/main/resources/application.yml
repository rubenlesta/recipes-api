# Puerto HTTP de la aplicación.
server:
  port: 8080

spoonacular:
  # La clave se proporciona mediante la variable de entorno local.
  api-key: ${SPOONACULAR_API_KEY:}
  # URL base de la API de Spoonacular.
  base-url: https://api.spoonacular.com

spring:
  application:
    name: recipes
  cache:
    # Cachés habilitadas para la aplicación.
    cache-names: recipes
    caffeine:
      # Duración de cada entrada y límite máximo de elementos.
      spec: maximumSize=100,expireAfterWrite=10m

